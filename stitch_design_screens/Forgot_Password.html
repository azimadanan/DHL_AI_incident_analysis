                        "label-bold": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F4F4F4;
        }
        /* Strict adherence to radius 2px for this specific view */
        .sharp-radius {
            border-radius: 2px !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Center Card Container -->
<main class="w-full max-w-[380px] bg-white shadow-sm sharp-radius flex flex-col p-8 border border-border-subtle">
<!-- Branding -->
<div class="mb-10 flex justify-center">
<img alt="DHL Logo" class="h-[50px] w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCnB27QrGND7sQTTpvK1rjLlrXvDjYW5qoNu8tVlxhr3Wjzsm2fs4Vao1_nmMv4g9g11s1TjTLDB41BE-VimSErQ_2O5tKdMZHrbxA_60-b4s7AzPcMjvJQk3MhSu7nebPuSL5IwLVNLv3XewZxa9vTlm9RZKRkHYe317smr4yU7MOb_l88S-5FLtN40u4NlSb7Cr-whiscdo744VqEDY9YyIeWb-Sg-HklqsAcjaOelRNP5dN5hdC-Sg2SZ0SAkQwB0lfZA1GhLAw"/>
</div>
<!-- Header -->
<header class="mb-8">
<h1 class="font-headline-lg text-headline-lg text-text-primary mb-2">Reset Password</h1>
<p class="font-body-md text-body-md text-text-secondary leading-relaxed">
                Enter your email address to receive recovery instructions.
            </p>
</header>
<!-- Form Section -->
<form class="flex flex-col gap-6" onsubmit="return false;">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-[11px] text-[#6B6B6B] uppercase tracking-wider" for="email">
                    EMAIL ADDRESS
                </label>
<input class="w-full h-[36px] px-3 border border-border-subtle sharp-radius focus:ring-0 focus:border-secondary-container text-body-md text-text-primary" id="email" placeholder="e.g. employee@dhl.com" type="email"/>
</div>
<!-- Primary Action -->
<button class="w-full h-[40px] bg-primary-container text-white font-label-bold text-label-md sharp-radius hover:bg-primary transition-colors flex items-center justify-center gap-2" type="submit">
                SEND RESET LINK
            </button>
</form>
<!-- Navigation Footer -->
<footer class="mt-10 flex justify-center border-t border-border-subtle pt-6">
<a class="flex items-center gap-1 font-label-md text-[12px] text-[#6B6B6B] hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Return to Login</span>
</a>
</footer>
</main>
<!-- Support/Compliance Footer (Optional for Professionalism) -->
<div class="fixed bottom-6 left-0 right-0 text-center">
<p class="font-label-md text-[11px] text-[#6B6B6B] uppercase tracking-widest opacity-60">
            DHL APSSC • Incident Management System • 2024
        </p>
</div>
</body></html>
