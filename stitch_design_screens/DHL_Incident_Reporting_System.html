<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-xl custom-shadow p-8 md:p-10 flex flex-col">
<!-- Header / Branding -->
<div class="flex flex-col items-start mb-8">
<img src="https://lh3.googleusercontent.com/aida-public/AB6AXuCbgJ4OTQjoNjNwJeSbCw3oICD_-zPQfJeuuEvUIhCwJx5uRlbdm8Z8L7qIo_nUUDzT30DsmBWwwPp17WQ8oLHjnCBXPoAfbqTTczHgbHbd3hwqVvDAFkmD3-A6ds2Li6B2ZZFUOtUlmv-9ljhiviNAAQdzZe-qZRWBgxMkMD6AHs5Th4mUgCHCnUdfE6_XWCI2NChrG_df2GHCvRyl9dcRXyF8lngHP-y2qGLeBMGOPa3_X_9WOJjOdf_23BbUsW-gbqFTIldvnMc5rg" alt="DHL Logo" class="w-[120px] h-auto mb-6">
<h1 class="font-headline-lg text-headline-lg text-text-primary">Incident Reporting System</h1>
<p class="font-body-md text-body-md text-text-secondary mt-2">DHL Asia Pacific Shared Services</p>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-text-primary uppercase" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-border-subtle rounded-lg font-body-md text-body-md text-text-primary focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all" id="email" name="email" required="" type="email" value="admin@dhl.com">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-text-primary uppercase" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-secondary" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-lowest border border-border-subtle rounded-lg font-body-md text-body-md text-text-primary focus:outline-none focus:ring-2 focus:ring-secondary-container focus:border-transparent transition-all" id="password" name="password" required="" type="password" value="admin123">
</div>
</div><div class="flex justify-end mt-1"><a href="/forgot-password" class="text-[12px] text-[#6B6B6B] hover:text-[#D40511] transition-colors">Forgot Password?</a></div>
<!-- Actions -->
<div class="flex items-center mt-[-8px]">
<label class="flex items-center gap-2 cursor-pointer">
<input class="w-4 h-4 rounded border-border-subtle text-primary-container focus:ring-primary-container" type="checkbox">
<span class="font-body-md text-body-md text-text-secondary">Remember me</span>
</label>

</div>
<button class="w-full bg-primary-container hover:bg-primary text-on-primary font-headline-md text-headline-md py-3 rounded-lg transition-colors mt-2 flex items-center justify-center gap-2" type="button">
                Sign In
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
